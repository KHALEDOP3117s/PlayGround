// Mission state and story
let shards=0,beacons=0,xp=0,level=1,questStarted=false,storyQueue=[],storyBusy=false,interactTarget=null,gamePaused=false,skillReady=true;const toastEl=document.querySelector('#toast');let toastTimer;
function toast(title,detail=''){toastEl.querySelector('strong').textContent=title;toastEl.querySelector('span').textContent=detail;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2100)}
function showStory(speaker,text){document.querySelector('#speaker').textContent=speaker;document.querySelector('#storyText').textContent=text;document.querySelector('#storycard').classList.add('show');storyBusy=true}
function closeStory(){document.querySelector('#storycard').classList.remove('show');storyBusy=false;if(storyQueue.length){const next=storyQueue.shift();setTimeout(()=>showStory(next[0],next[1]),180)}}
document.querySelector('#storyNext').onclick=closeStory;
function addXP(n){xp+=n;while(xp>=100){xp-=100;level++;toast('LEVEL UP · '+level,'A new skill point is yours.')}document.querySelector('#level').textContent='✦ LV '+level;document.querySelector('#xpText').textContent=xp+' / 100 XP'}
function objectiveCount(){return objectives.filter(o=>o.done&&o.type==='beacon').length}
function updateQuest(){const title=document.querySelector('#questTitle'),text=document.querySelector('#questText'),step=document.querySelector('#questStep'),bar=document.querySelector('#progressBar');document.querySelector('#shardCount').textContent='✧ '+shards+' / 6';if(!questStarted){title.textContent='The valley remembers';text.textContent='Find the trailkeeper at the old watchtower.';step.textContent='A new beginning';bar.style.width='8%';return}if(beacons<3){title.textContent='Awaken the waystones';text.textContent='Restore the three old beacons scattered through the vale.';step.textContent=beacons+' / 3 waystones';bar.style.width=(12+beacons*15)+'%'}else if(shards<6){title.textContent='Gather the starlit fragments';text.textContent='The trailkeeper needs six fragments to open the ancient gate.';step.textContent=shards+' / 6 fragments';bar.style.width=(57+shards*5)+'%'}else{title.textContent='Beyond the veil';text.textContent='Return to the northern portal and discover what waits beyond.';step.textContent='The gate is awake';bar.style.width='94%'}}
function interact(){if(storyBusy||gamePaused)return;if(!questStarted){questStarted=true;updateQuest();showStory('ELDER ROWAN','The vale is losing its light. Three waystones have gone quiet, and the old gate is hungry for starlight. Find the beacons, gather the fragments, and come back to me. The path will remember you.');return}if(!interactTarget)return;const o=interactTarget;if(o.type==='npc'){if(beacons<3){showStory('ELDER ROWAN',beacons===0?'The first beacon lies west, beyond the bent pines. Follow the little river, and trust the lights.':'You have awakened '+beacons+' of the three waystones. Listen for their song; it carries farther than you think.')}else if(shards<6){showStory('ELDER ROWAN','The waystones sing again. Now find all six starlit fragments; they are scattered where the old trail meets the wild. Then the north gate can open.')}else{showStory('ELDER ROWAN','You did it. The gate is awake! Beyond it lies the heart of the valley—and the answer to why its light was taken. Go, wayfinder. The story is yours now.');}return}if(o.type==='fragment'){o.done=true;shards++;addXP(25);o.mesh.visible=false;toast('ST★RLIGHT FOUND','A memory returns to the valley.');if(shards===6){storyQueue.push(['THE VALE','Six sparks become a path. To the north, the old gate stirs.']);}updateQuest();return}if(o.type==='beacon'){o.done=true;beacons++;addXP(35);o.mesh.visible=false;toast('WAYSTONE RESTORED','The valley brightens around you.');if(beacons===3)storyQueue.push(['THE VALE','Three lights answer one another across the hills. The northern gate is calling.']);updateQuest();return}if(o.type==='portal'){if(beacons<3||shards<6){toast('THE GATE IS QUIET','Restore all waystones and find six fragments.');return}gamePaused=true;openPanel('THE STORY CONTINUES','You cross the threshold. Somewhere beyond the veil, a lost sun is waiting.','The first chapter is complete. Your journey through the Shattered Vale has only just begun.','✦ CHAPTER COMPLETE','Continue exploring');}}
function openPanel(eyebrow,title,body,action='Resume journey',secondary=''){document.querySelector('#panelEyebrow').textContent=eyebrow;document.querySelector('#panelTitle').textContent=title;document.querySelector('#panelBody').textContent=body;document.querySelector('#panelContent').innerHTML='';const actions=document.querySelector('#panelActions');actions.innerHTML='';const b=document.createElement('button');b.className='panelbutton';b.textContent=action;b.onclick=()=>{document.querySelector('#panelback').classList.remove('open');gamePaused=false};actions.appendChild(b);if(secondary){const c=document.createElement('button');c.className='panelbutton secondary';c.textContent=secondary;c.onclick=()=>showMap();actions.appendChild(c)}document.querySelector('#panelback').classList.add('open')}
function showMenu(){gamePaused=true;openPanel('PAUSED','Take a breath, wayfinder','The valley is still here when you are ready.','Resume journey','Field guide');document.querySelector('#panelActions').lastChild.onclick=()=>showMap()}
function showMap(){gamePaused=true;document.querySelector('#panelback').classList.add('open');document.querySelector('#panelEyebrow').textContent='FIELD GUIDE';document.querySelector('#panelTitle').textContent='Your journey';document.querySelector('#panelBody').textContent='A quiet world of ancient forests, hidden lights, and a story waiting to be found.';document.querySelector('#panelContent').innerHTML=`<div class="statgrid"><div class="stat"><b>${shards}/6</b><span>FRAGMENTS</span></div><div class="stat"><b>${beacons}/3</b><span>WAYSTONES</span></div><div class="stat"><b>${level}</b><span>WAYFINDER</span></div></div><p><b style="color:#ffdc9b">Controls</b><br>Move with the left stick or WASD. Drag anywhere to look around. Jump over rocks and use the ✧ skill to dash. Approach a person or glowing object and tap the action prompt.</p>`;const a=document.querySelector('#panelActions');a.innerHTML='';const b=document.createElement('button');b.className='panelbutton';b.textContent='Back to the vale';b.onclick=()=>{document.querySelector('#panelback').classList.remove('open');gamePaused=false};a.appendChild(b)}
document.querySelector('#mapBtn').onclick=showMap;document.querySelector('#menuBtn').onclick=showMenu;document.querySelector('#closePanel').onclick=()=>{document.querySelector('#panelback').classList.remove('open');gamePaused=false};document.querySelector('#interact').onclick=interact;

// Touch-first movement, with keyboard and mouse fallbacks.
let yaw=0,moveX=0,moveY=0,jumpV=0,onGround=true,dash=0,dashCooldown=0,walkTime=0,lastTime=performance.now();const knob=document.querySelector('#knob'),stick=document.querySelector('#stick');let stickPointer=null,lookPointer=null,lastLookX=0,lastLookY=0;
function stickMove(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.34,d=Math.hypot(dx,dy),k=Math.min(1,max/(d||1));moveX=dx*k/max;moveY=dy*k/max;knob.style.transform=`translate(${dx*k}px,${dy*k}px)`}
stick.addEventListener('pointerdown',e=>{e.preventDefault();stickPointer=e.pointerId;stick.setPointerCapture(e.pointerId);stickMove(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer)stickMove(e)});function resetStick(e){if(e.pointerId===stickPointer){stickPointer=null;moveX=moveY=0;knob.style.transform=''}}stick.addEventListener('pointerup',resetStick);stick.addEventListener('pointercancel',resetStick);
let keys={};window.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='Space'&&!e.repeat)jump()});window.addEventListener('keyup',e=>keys[e.code]=false);
function jump(){if(onGround&&!gamePaused&&!storyBusy){jumpV=7.6;onGround=false}}
document.querySelector('#jumpBtn').addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.querySelector('#skillBtn').addEventListener('pointerdown',e=>{e.preventDefault();if(skillReady&&!gamePaused){dash=.34;dashCooldown=3.8;skillReady=false;toast('WINDSTEP','A burst of forest magic.')}});
renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button===0){lookPointer=e.pointerId;lastLookX=e.clientX;lastLookY=e.clientY}});window.addEventListener('pointermove',e=>{if(e.pointerId===lookPointer){yaw-=(e.clientX-lastLookX)*.004;lastLookX=e.clientX;lastLookY=e.clientY}});window.addEventListener('pointerup',e=>{if(e.pointerId===lookPointer)lookPointer=null});
// On phones drag the open playfield to orbit the camera.
renderer.domElement.addEventListener('touchstart',e=>{if(e.touches.length===1){const t=e.touches[0];if(t.clientX>innerWidth*.3){lookPointer='touch';lastLookX=t.clientX}}},{passive:true});renderer.domElement.addEventListener('touchmove',e=>{if(lookPointer==='touch'&&e.touches.length===1){const t=e.touches[0];yaw-=(t.clientX-lastLookX)*.006;lastLookX=t.clientX}},{passive:true});renderer.domElement.addEventListener('touchend',()=>{if(lookPointer==='touch')lookPointer=null},{passive:true});
const mapCanvas=document.querySelector('#mapCanvas'),mapCtx=mapCanvas.getContext('2d');function drawMap(){const c=mapCtx;c.clearRect(0,0,180,180);c.fillStyle='#28443d';c.fillRect(0,0,180,180);c.strokeStyle='#89b78b';c.lineWidth=7;c.beginPath();for(let i=0;i<80;i++){let t=i/79*11.4,x=90+Math.sin(t*.72)*21*1.03,y=90+Math.cos(t*.72)*21*1.03;i?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();for(const o of objectives){if(o.done)continue;const x=90+o.x*.78,y=90+o.z*.78;c.fillStyle=o.type==='beacon'?'#65f3da':'#ffce78';c.beginPath();c.arc(x,y,3.8,0,Math.PI*2);c.fill()}c.fillStyle='#f6d29a';c.beginPath();c.arc(90+player.position.x*.78,90+player.position.z*.78,4,0,Math.PI*2);c.fill();c.strokeStyle='#fff';c.lineWidth=1.5;c.stroke()}
function update(dt,time){if(!gamePaused){let kx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),ky=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);let ix=kx+moveX,iy=ky+moveY,len=Math.hypot(ix,iy);if(len>1){ix/=len;iy/=len}let speed=5.1;if(dash>0){speed=16;dash=Math.max(0,dash-dt)}if(dashCooldown>0){dashCooldown-=dt;if(dashCooldown<=0)skillReady=true}
if(len>.08){const forwardX=Math.sin(yaw),forwardZ=-Math.cos(yaw),rightX=Math.cos(yaw),rightZ=Math.sin(yaw);player.position.x+=(rightX*ix+forwardX*(-iy))*speed*dt;player.position.z+=(rightZ*ix+forwardZ*(-iy))*speed*dt;player.rotation.y=Math.atan2(rightX*ix+forwardX*(-iy),-(rightZ*ix+forwardZ*(-iy)));walkTime+=dt*10;legs[0].rotation.x=Math.sin(walkTime)*.52;legs[1].rotation.x=-Math.sin(walkTime)*.52}else{legs[0].rotation.x*=.8;legs[1].rotation.x*=.8}
player.position.x=THREE.MathUtils.clamp(player.position.x,-99,99);player.position.z=THREE.MathUtils.clamp(player.position.z,-99,99);jumpV-=19*dt;player.position.y+=jumpV*dt;let gy=groundY(player.position.x,player.position.z);if(player.position.y<gy){player.position.y=gy;jumpV=0;onGround=true}avatar.position.y=onGround?0:Math.sin(time*8)*.07;
}
const target=new THREE.Vector3(player.position.x,player.position.y+1.6,player.position.z);const camOffset=new THREE.Vector3(Math.sin(yaw)*8,4.2,Math.cos(yaw)*8);camera.position.lerp(target.clone().add(camOffset),1-Math.pow(.002,dt));camera.lookAt(target);
// Find the closest usable world object.
let nearest=null,nearestD=4.2;for(const o of objectives){if(o.done)continue;const d=Math.hypot(player.position.x-o.x,player.position.z-o.z);if(d<nearestD){nearest=o;nearestD=d}}let dn=Math.hypot(player.position.x-npcPos.x,player.position.z-npcPos.z);if(dn<nearestD){nearest={type:'npc'};nearestD=dn}const dp=Math.hypot(player.position.x-portalPos.x,player.position.z-portalPos.z);if(dp<nearestD){nearest={type:'portal'};nearestD=dp}interactTarget=nearest;const ib=document.querySelector('#interact');if(nearest){ib.classList.add('show');ib.textContent=nearest.type==='npc'?'TALK · TRAILKEEPER':nearest.type==='fragment'?'COLLECT · STARLIGHT':nearest.type==='beacon'?'RESTORE · WAYSTONE':'ENTER · THE GATE'}else ib.classList.remove('show');
for(const o of objectives)if(!o.done){o.mesh.rotation.y+=dt*.55;o.mesh.position.y=groundY(o.x,o.z)+Math.sin(time*2+o.index)*.18}npcMark.position.y=npcPos.y+3.45+Math.sin(time*2.2)*.15;npcMark.rotation.y+=dt*.8;portal.rotation.y=Math.sin(time*.6)*.08;portalGlow.intensity=1.3+Math.sin(time*2)*.45;firemesh.scale.setScalar(.85+Math.sin(time*9)*.13);fire.intensity=1.7+Math.sin(time*10)*.6;document.querySelector('#needle').style.transform=`rotate(${yaw*180/Math.PI}deg)`;drawMap();
}
function animate(now){requestAnimationFrame(animate);const dt=Math.min(.04,(now-lastTime)/1000);lastTime=now;update(dt,now/1000);renderer.render(scene,camera)}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,1.65));renderer.setSize(innerWidth,innerHeight)});
updateQuest();setTimeout(()=>toast('WELCOME TO THE VALE','Find the golden light at the old watchtower.'),900);
</script></body></html>
